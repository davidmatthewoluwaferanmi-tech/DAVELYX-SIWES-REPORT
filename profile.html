<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D221B">
  <title>Your profile | DAVELYX</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/marketplace.css">
  <style>
    .profile-card{max-width:620px;margin:36px auto;padding:clamp(22px,5vw,42px);background:#fff;border:1px solid #e4e8e1;border-radius:20px;box-shadow:0 20px 55px rgba(13,34,27,.09)}
    .profile-card label{display:block;margin:18px 0;font-weight:600}.profile-card input{display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #ccd5ce;border-radius:8px;font:inherit}
    #avatar-preview{width:96px;height:96px;object-fit:cover;border-radius:50%;background:#eee}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>DAVELYX<small>MARKETPLACE</small></span></a><a href="marketplace.html">Marketplace</a></nav></header>
  <main class="market-container">
    <section class="profile-card">
      <h1>Set up your profile</h1>
      <p>Add your contact details so buyers and sellers can reach you on WhatsApp.</p>
      <img id="avatar-preview" src="https://placehold.co/160x160?text=Avatar" alt="Avatar preview">
      <form id="profile-form">
        <label>Username<input name="username" type="text" autocomplete="nickname" maxlength="60" required></label>
        <label>Phone / WhatsApp number<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label>
        <label>Location<input name="location" type="text" autocomplete="address-level2" maxlength="120" required></label>
        <label>Avatar image URL (optional)<input name="avatar_url" type="url" inputmode="url" placeholder="https://example.com/avatar.jpg"></label>
        <button class="btn btn-gold" type="submit">Save profile</button>
      </form>
      <p id="profile-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
